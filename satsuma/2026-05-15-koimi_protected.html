function b64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

async function unlock(){
  const pw = document.getElementById('pw').value;
  document.getElementById('err').style.display='none';
  document.getElementById('loading').style.display='block';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(SALT), iterations:100000, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(NONCE)}, key, b64(ENC));
    const html = new TextDecoder().decode(dec);
    document.open(); document.write(html); document.close();
  } catch(e){
    document.getElementById('loading').style.display='none';
    document.getElementById('err').style.display='block';
  }
}
</script>
